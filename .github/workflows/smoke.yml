name: Smoke test (cinematic)

# اختبار سريع لتوليد الصور الحقيقية على خوادم GitHub: يعمل عند تعديل أي ملف داخل smoke/
on:
  push:
    paths: ["smoke/**", ".github/workflows/smoke.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-hosny-amiri libraqm0 libfribidi0
          pip install -r requirements.txt
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p output
          IMG=pollinations; [ -n "$GEMINI_API_KEY" ] && IMG=gemini
          set -o pipefail
          python make_video.py -f smoke/scene.txt -o output/smoke.mp4 --aspect 9:16 \
            --style cinematic --images "$IMG" 2>&1 | tee output/smoke_log.txt
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(ls output/smoke.mp4 output/smoke.srt output/smoke_prompts.txt output/smoke_log.txt 2>/dev/null || true)
          [ -z "$FILES" ] && exit 0
          gh release create "smoke-${{ github.run_number }}" $FILES \
            --title "smoke #${{ github.run_number }}" --notes "اختبار توليد الصور"
