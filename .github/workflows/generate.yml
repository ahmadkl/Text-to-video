name: Generate video

on:
  # من تبويب Actions: اختر "Generate video" ثم Run workflow
  workflow_dispatch:
    inputs:
      prompt:
        description: "نص الفيديو (افصل المشاهد بـ ' || ')"
        required: true
        type: string
      aspect:
        description: "أبعاد الفيديو"
        type: choice
        options: ["16:9", "9:16", "1:1"]
        default: "16:9"
      voice:
        description: "auto، أو اسم صوت edge-tts، أو none بدون صوت"
        type: string
        default: "auto"
      style:
        description: "cinematic: صور واقعية/أنمي بالذكاء الاصطناعي، cartoon: شخصيات مرسومة بالكود"
        type: choice
        options: ["cinematic", "cartoon"]
        default: "cinematic"
      look:
        description: "شكل الصور في الوضع السينمائي"
        type: choice
        options: ["realistic", "anime", "cartoon"]
        default: "realistic"
      images:
        description: "مزود الصور: auto يستخدم gemini إن وُجد مفتاحه وإلا pollinations المجاني"
        type: choice
        options: ["auto", "pollinations", "gemini"]
        default: "auto"
      mode:
        description: "auto يكتشف السيناريو تلقائيًا، أو screenplay، أو simple (نص متحرك فقط)"
        type: choice
        options: ["auto", "screenplay", "simple"]
        default: "auto"
  # أو افتح Issue عنوانه يبدأ بكلمة video ونصه هو نص الفيديو (فقرة = مشهد)
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  generate:
    # الـ Issue يعمل فقط إذا فتحه مالك المستودع، حتى لا يشغّله الغرباء
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, 'video'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-hosny-amiri libraqm0 libfribidi0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Prepare prompt
        env:
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p output
          if [ "${{ github.event_name }}" = "issues" ]; then
            printf '%s\n' "$ISSUE_BODY" > output/prompt.txt
          else
            printf '%s\n' "$INPUT_PROMPT" > output/prompt.txt
          fi

      - name: Generate video
        env:
          ASPECT: ${{ github.event.inputs.aspect }}
          VOICE: ${{ github.event.inputs.voice }}
          MODE: ${{ github.event.inputs.mode }}
          STYLE: ${{ github.event.inputs.style }}
          LOOK: ${{ github.event.inputs.look }}
          IMAGES: ${{ github.event.inputs.images }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: |
          IMG="${IMAGES:-auto}"
          if [ "$IMG" = "auto" ]; then
            if [ -n "$GEMINI_API_KEY" ]; then IMG=gemini; else IMG=pollinations; fi
          fi
          python make_video.py -f output/prompt.txt -o output/video.mp4 \
            --aspect "${ASPECT:-16:9}" --voice "${VOICE:-auto}" --mode "${MODE:-auto}" \
            --style "${STYLE:-cinematic}" --look "${LOOK:-realistic}" --images "$IMG"

      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            output/video.*
            output/video_prompts.txt

      # إصدار (Release) يحمل الفيديو، فيسهل تنزيله من الجوال
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-${{ github.run_number }}"
          gh release create "$TAG" output/video.mp4 output/video.srt \
            --title "فيديو #${{ github.run_number }}" \
            --notes "تم توليد الفيديو من النص تلقائيًا."
          URL=$(gh release view "$TAG" --json url -q .url)
          echo "Release: $URL" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --body "✅ الفيديو جاهز: $URL"
          fi

      # إرسال الفيديو إلى تيليجرام (اختياري: يعمل فقط إذا أضفت السرّين في Settings ← Secrets)
      - name: Send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set; skipping."
            exit 0
          fi
          SIZE=$(stat -c %s output/video.mp4)
          if [ "$SIZE" -gt 49000000 ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="$TG_CHAT" -d text="الفيديو جاهز لكنه أكبر من 50MB، حمّله من Releases."
          else
            curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendVideo" \
              -F chat_id="$TG_CHAT" -F video=@output/video.mp4 -F supports_streaming=true \
              -F caption="الفيديو جاهز"
          fi
