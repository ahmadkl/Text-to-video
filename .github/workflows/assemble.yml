name: Assemble video

on:
  # بعد رفع المقاطع إلى مجلد clips/ شغّل: Actions ← Assemble video ← Run workflow
  workflow_dispatch:
    inputs:
      burn:
        description: "احرق الترجمة داخل الفيديو"
        type: boolean
        default: true
      shots:
        description: "ملف اللقطات الذي تؤخذ منه الترجمة"
        type: string
        default: "results/scene1/shots.json"
  # أو يعمل تلقائيًا عند رفع/تعديل ملفات داخل clips/
  push:
    paths: ["clips/**"]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-hosny-amiri

      - name: Assemble
        env:
          BURN: ${{ github.event.inputs.burn }}
          SHOTS: ${{ github.event.inputs.shots }}
        run: |
          FLAG="--burn"
          if [ "$BURN" = "false" ]; then FLAG=""; fi
          python assemble.py -c clips -s "${SHOTS:-results/scene1/shots.json}" -o output/final.mp4 $FLAG

      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ github.run_number }}
          path: output/final.*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="final-${{ github.run_number }}"
          FILES="output/final.mp4"
          [ -f output/final.srt ] && FILES="$FILES output/final.srt"
          gh release create "$TAG" $FILES --title "الفيديو النهائي #${{ github.run_number }}" \
            --notes "تم تجميع المقاطع تلقائيًا."
          echo "Release: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
